<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>nest-order-api - API docs</title>
    <!--
      Static snapshot of the OpenAPI spec, generated by scripts/export-openapi.js
      against the built app (dist/, compiled with the @nestjs/swagger CLI
      plugin enabled - see nest-cli.json) and published here by the `pages`
      CI job on every push to main. There is no live instance of this API to
      browse Swagger UI on, so this is a build-time snapshot, not a live docs
      server.
    -->
    <style>
      body {
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <redoc spec-url="./openapi.json"></redoc>
    <script src="https://cdn.redocly.com/redoc/latest/bundles/redoc.standalone.js"></script>
  </body>
</html>
