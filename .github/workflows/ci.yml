name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "25"
          cache: npm
      - run: npm ci
      - run: npm run lint -- --max-warnings=0

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "25"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:cov
      # test:e2e usa Testcontainers: sobe seu proprio Postgres via Docker, ja disponivel
      # nativamente nos runners hospedados do GitHub - sem precisar de um services: aqui.
      - run: npm run test:e2e
      # Gera o snapshot do OpenAPI a partir do build (dist/, com o plugin do
      # @nestjs/swagger habilitado no nest-cli.json) - mesmo Testcontainers
      # Postgres do test:e2e, ver scripts/export-openapi.js.
      - run: npm run docs:export
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: openapi-spec
          path: dist-openapi/openapi.json
          if-no-files-found: error
          retention-days: 7

  # Pega migration desatualizada em relacao as entities (ex.: alguem adiciona uma coluna sem
  # gerar a migration correspondente) antes que vire drift em producao - equivalente ao
  # `alembic check` do fastapi-order-api, adaptado pro TypeORM (que nao tem um comando
  # "check" dedicado): roda as migrations existentes, tenta gerar uma nova a partir do estado
  # atual das entities, e falha se o TypeORM encontrar alguma diferenca pra gerar.
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nest_order_api
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "25"
          cache: npm
      - run: npm ci
      - run: npm run migration:run
      - name: Check for schema drift
        run: |
          set +e
          OUTPUT=$(npm run typeorm -- migration:generate tmp/DriftCheck 2>&1)
          EXIT_CODE=$?
          set -e
          echo "$OUTPUT"
          if echo "$OUTPUT" | grep -q "No changes in database schema were found"; then
            echo "No drift detected."
            exit 0
          elif [ $EXIT_CODE -eq 0 ]; then
            echo "::error::Schema drift detected - entities changed without a matching migration (see generated file above)."
            exit 1
          else
            echo "::error::migration:generate failed for a reason unrelated to drift."
            exit $EXIT_CODE
          fi

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    # Build-only on PRs (validates the Dockerfile still produces a working image); push to GHCR
    # only from main, where GITHUB_TOKEN has package-write on this repo by default - a fork's PR
    # run gets a read-only token, so pushing there would just fail, not add security value.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Scans a local copy of the image before anything is pushed. HIGH/CRITICAL findings with a
      # fix available fail the job; unfixed ones are noise nobody can act on yet. The build
      # below reuses these layers from the builder's own cache.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          tags: order-api:scan
          cache-from: type=gha
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: order-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:latest,ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Publica um snapshot estatico do OpenAPI spec (ver comentario no job `test`
  # acima) como pagina Redoc - a unica forma de ver o formato da API sem
  # clonar o repo e rodar `docker compose up`. So em push pra main. O
  # environment/permissions `github-pages` aqui e o contrato exigido pelo
  # proprio actions/deploy-pages, sem relacao com OIDC/AWS.
  pages:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: openapi-spec
          path: site
      - run: cp docs/api-docs/index.html site/index.html
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
