version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      weekly-batch:
        patterns:
          - "*"
    ignore:
      # typescript-eslint doesn't support TS 7 yet (peer dep caps at <6.1.0)
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      weekly-batch:
        patterns:
          - "*"
